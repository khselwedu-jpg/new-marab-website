    <style>
      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/cairo-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/cairo-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/cairo-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/cairo-700.woff2') format('woff2');

    <link rel="preload" href="/fonts/cairo-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cairo-400.woff2" as="font" type="font/woff2" crossorigin />
