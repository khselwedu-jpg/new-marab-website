<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="شركة مأرب للتأمين - نقدم أفضل حلول التأمين في اليمن. تأمين صحي، سيارات، بحري، هندسي والمزيد. Mareb Insurance Company Yemen." />
    <meta name="theme-color" content="#0A1F3D" />
    <title>مأرب للتأمين | Mareb Insurance Company</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
    <!-- Self-hosted Cairo font - only 2 weights for performance -->
    <style>
      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/cairo-400.woff2') format('woff2');
        unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+0020-007E;
      }
      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 500 600;
        font-display: swap;
        src: url('/fonts/cairo-600.woff2') format('woff2');
        unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+0020-007E;
      }
      @font-face {
        font-family: 'Cairo';
        font-style: normal;
        font-weight: 700 800;
        font-display: swap;
        src: url('/fonts/cairo-700.woff2') format('woff2');
        unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+0020-007E;
      }
      /* Critical above-fold styles to prevent FOUC */
      body { margin: 0; background: #fff; font-family: 'Cairo', sans-serif; }
      #root { min-height: 100vh; }
    </style>
    <!-- Preload only 2 critical font weights -->
    <link rel="preload" href="/fonts/cairo-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cairo-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Preload first hero image for LCP - responsive -->
    <link rel="preload" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663249456574/9MB65zStTYVQDwrWb5myAt/hero1-mobile_4b23656d.webp" as="image" fetchpriority="high" imagesrcset="https://d2xsxph8kpxj0f.cloudfront.net/310519663249456574/9MB65zStTYVQDwrWb5myAt/hero1-mobile_4b23656d.webp 640w, https://d2xsxph8kpxj0f.cloudfront.net/310519663249456574/9MB65zStTYVQDwrWb5myAt/hero1_d838ccf7.webp 1280w" imagesizes="100vw" />
    <!-- Preconnect to CDN -->
    <link rel="preconnect" href="https://d2xsxph8kpxj0f.cloudfront.net" crossorigin />
  </head>
